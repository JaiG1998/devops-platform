apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: payment-egress-email
  namespace: default
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - selector:
            matchLabels:
              app.kubernetes.io/name: emailservice
      ports:
        - protocol: TCP
          port: 8080