apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: checkoutservice-egress
  namespace: default
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - selector:
            matchLabels:
              app.kubernetes.io/name: cartservice
      ports:
        - protocol: TCP
          port: 7070
    - to:
        - selector:
            matchLabels:
              app.kubernetes.io/name: productcatalogservice
      ports:
        - protocol: TCP
          port: 3550
    - to:
        - selector:
            matchLabels:
              app.kubernetes.io/name: currencyservice
      ports:
        - protocol: TCP
          port: 7000
    - to:
        - selector:
            matchLabels:
              app.kubernetes.io/name: shippingservice
      ports:
        - protocol: TCP
          port: 50051
    - to:
        - selector:
            matchLabels:
              app.kubernetes.io/name: paymentservice
      ports:
        - protocol: TCP
          port: 50051
    - to:
        - selector:
            matchLabels:
              app.kubernetes.io/name: emailservice
      ports:
        - protocol: TCP
          port: 8080