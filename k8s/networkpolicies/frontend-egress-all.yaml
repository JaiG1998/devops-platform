apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend-egress-all
  namespace: default
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - selector:
            matchLabels:
              app.kubernetes.io/name: productcatalogservice
      ports:
        - protocol: TCP
          port: 3550
    - to:
        - selector:
            matchLabels:
              app.kubernetes.io/name: cartservice
      ports:
        - protocol: TCP
          port: 7070
    - to:
        - selector:
            matchLabels:
              app.kubernetes.io/name: currencyservice
      ports:
        - protocol: TCP
          port: 7000
    - to:
        - selector:
            matchLabels:
              app.kubernetes.io/name: recommendationservice
      ports:
        - protocol: TCP
          port: 8080
    - to:
        - selector:
            matchLabels:
              app.kubernetes.io/name: shippingservice
      ports:
        - protocol: TCP
          port: 50051
    - to:
        - selector:
            matchLabels:
              app.kubernetes.io/name: adservice
      ports:
        - protocol: TCP
          port: 9555
    - to:
        - selector:
            matchLabels:
              app.kubernetes.io/name: checkoutservice
      ports:
        - protocol: TCP
          port: 5050
    - to:
        - selector:
            matchLabels:
              app.kubernetes.io/name: loadgenerator
      ports:
        - protocol: TCP
          port: 8080