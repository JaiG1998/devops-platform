{{- range $name, $service := .Values.services }}
{{- if $service.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "online-boutique.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  replicas: {{ default 1 $service.replicaCount }}
  selector:
    matchLabels:
      {{- include "online-boutique.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: {{ $name }}
  template:
    metadata:
      labels:
        {{- include "online-boutique.selectorLabels" $ | nindent 8 }}
        app.kubernetes.io/component: {{ $name }}
    spec:
      {{- $tsc := default (get $.Values "topologySpreadConstraints") (get $service "topologySpreadConstraints") }}
      {{- if $tsc }}
      topologySpreadConstraints:
        {{- range $constraint := $tsc }}
        - maxSkew: {{ $constraint.maxSkew | default 1 }}
          topologyKey: {{ $constraint.topologyKey }}
          whenUnsatisfiable: {{ $constraint.whenUnsatisfiable | default "ScheduleAnyway" }}
          labelSelector:
            matchLabels:
              app.kubernetes.io/component: {{ $name }}
        {{- end }}
      {{- end }}
      {{- $svcReplicaCount := default 1 $service.replicaCount -}}
      {{- if gt (int $svcReplicaCount) 1 }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              labelSelector:
                matchExpressions:
                - key: app.kubernetes.io/component
                  operator: In
                  values:
                  - {{ $name }}
{{- end }}
      serviceAccountName: {{ $name }}-sa
      automountServiceAccountToken: {{ default $.Values.automountServiceAccountToken $service.automountServiceAccountToken }}
      securityContext:
        {{- toYaml (default $.Values.podSecurityContext $service.podSecurityContext) | nindent 8 }}
      containers:
        - name: {{ $name }}
          image: "{{ default $.Values.global.imageRegistry $service.image.registry }}/{{ $service.image.repository }}:{{ default $.Values.global.defaultTag $service.image.tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: {{ $service.port }}
              name: http
          securityContext:
            {{- toYaml (default $.Values.securityContext $service.securityContext) | nindent 12 }}
          {{- with $service.env }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $service.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $service.probes }}
          {{- if .startupProbe }}
          startupProbe:
            {{- toYaml .startupProbe | nindent 12 }}
          {{- else if .startup }}
          startupProbe:
            {{- if eq $name "frontend" }}
            httpGet:
              path: /
              port: {{ $service.port }}
            {{- else if eq $name "redis" }}
            tcpSocket:
              port: {{ $service.port }}
            {{- else }}
            tcpSocket:
              port: {{ $service.port }}
            {{- end }}
          {{- else if .startup }}
          startupProbe:
            {{- toYaml .startup | nindent 12 }}
          {{- end }}
          {{- if .livenessProbe }}
          livenessProbe:
            {{- toYaml .livenessProbe | nindent 12 }}
          {{- else if .liveness }}
          livenessProbe:
            {{- toYaml .liveness | nindent 12 }}
          {{- end }}
          {{- if .readinessProbe }}
          readinessProbe:
            {{- toYaml .readinessProbe | nindent 12 }}
          {{- else if .readiness }}
          readinessProbe:
            {{- toYaml .readiness | nindent 12 }}
          {{- end }}
          {{- end }}
          {{- if $service.emptyDirMounts }}
          volumeMounts:
            {{- range $mount := $service.emptyDirMounts }}
            - name: empty-dir
              mountPath: {{ $mount }}
            {{- end }}
          {{- end }}
{{- if $service.emptyDirMounts }}
      volumes:
        - name: empty-dir
          emptyDir: {}
      {{- end }}
---
{{- end }}
{{- end }}