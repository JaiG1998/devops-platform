# k8s/charts/online-boutique/values.yaml
global:
  imageRegistry: gcr.io/google-samples/microservices-demo
  defaultTag: v0.10.1

nameOverride: ""
fullnameOverride: ""

services:
  emailservice:
    enabled: true
    image:
      repository: emailservice
      tag: ""
    port: 8080
    env:
      - name: PORT
        value: "8080"
    resources:
      requests:
        cpu: 100m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi
    probes:
      startup:
        initialDelaySeconds: 10
        periodSeconds: 5
      liveness:
        initialDelaySeconds: 10
        periodSeconds: 10
      readiness:
        initialDelaySeconds: 10
        periodSeconds: 10

  checkoutservice:
    enabled: true
    image:
      repository: checkoutservice
      tag: ""
    port: 5050
    env:
      - name: PORT
        value: "5050"
      - name: SHIPPING_SERVICE_ADDR
        value: "shipping-service:50051"
      - name: PRODUCT_CATALOG_SERVICE_ADDR
        value: "productcatalog-service:3550"
      - name: CART_SERVICE_ADDR
        value: "cart-service:7070"
      - name: CURRENCY_SERVICE_ADDR
        value: "currency-service:7000"
      - name: PAYMENT_SERVICE_ADDR
        value: "payment-service:50051"
      - name: EMAIL_SERVICE_ADDR
        value: "email-service:8080"
    resources:
      requests:
        cpu: 100m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi
    probes:
      startup:
        initialDelaySeconds: 10
        periodSeconds: 5
      liveness:
        initialDelaySeconds: 10
        periodSeconds: 10
      readiness:
        initialDelaySeconds: 10
        periodSeconds: 10

  recommendationservice:
    enabled: true
    image:
      repository: recommendationservice
      tag: ""
    port: 8080
    env:
      - name: PORT
        value: "8080"
      - name: PRODUCT_CATALOG_SERVICE_ADDR
        value: "productcatalog-service:3550"
    resources:
      requests:
        cpu: 100m
        memory: 220Mi
      limits:
        cpu: 500m
        memory: 450Mi
    probes:
      startup:
        initialDelaySeconds: 10
        periodSeconds: 5
      liveness:
        initialDelaySeconds: 10
        periodSeconds: 10
      readiness:
        initialDelaySeconds: 10
        periodSeconds: 10

  frontend:
    enabled: true
    serviceType: ClusterIP # Default ClusterIP so EKS creates no external LB by default
    image:
      repository: frontend
      tag: ""
    port: 8080
    env:
      - name: PORT
        value: "8080"
      - name: PRODUCT_CATALOG_SERVICE_ADDR
        value: "productcatalogservice:3550"
      - name: CURRENCY_SERVICE_ADDR
        value: "currencyservice:7000"
      - name: CART_SERVICE_ADDR
        value: "cartservice:7070"
      - name: SHIPPING_SERVICE_ADDR
        value: "shippingservice:50051"
      - name: RECOMMENDATION_SERVICE_ADDR
        value: "recommendationservice:8080"
      - name: CHECKOUT_SERVICE_ADDR
        value: "checkoutservice:5050"
      - name: AD_SERVICE_ADDR
        value: "adservice:9555"
      - name: SHOPPING_ASSISTANT_SERVICE_ADDR
        value: "shopping-assistant-service:8080"
    resources:
      requests:
        cpu: 100m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi
    probes:
      startup:
        initialDelaySeconds: 30
        periodSeconds: 5
      liveness:
        initialDelaySeconds: 15
        periodSeconds: 10
      readiness:
        initialDelaySeconds: 15
        periodSeconds: 10

  paymentservice:
    enabled: true
    image:
      repository: paymentservice
      tag: ""
    port: 50051
    env:
      - name: PORT
        value: "50051"
      - name: DISABLE_PROFILER
        value: "1"
    resources:
      requests:
        cpu: 100m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi
    probes:
      startup:
        initialDelaySeconds: 30
        periodSeconds: 5
      liveness:
        initialDelaySeconds: 15
        periodSeconds: 10
      readiness:
        initialDelaySeconds: 15
        periodSeconds: 10

  productcatalogservice:
    enabled: true
    image:
      repository: productcatalogservice
      tag: ""
    port: 3550
    env:
      - name: PORT
        value: "3550"
      - name: DISABLE_PROFILER
        value: "1"
    resources:
      requests:
        cpu: 200m
        memory: 128Mi
      limits:
        cpu: 400m
        memory: 256Mi
    probes:
      startup:
        initialDelaySeconds: 30
        periodSeconds: 5
      liveness:
        initialDelaySeconds: 15
        periodSeconds: 10
      readiness:
        initialDelaySeconds: 15
        periodSeconds: 10

  cartservice:
    enabled: true
    image:
      repository: cartservice
      tag: ""
    port: 7070
    env:
      - name: REDIS_ADDR
        value: "redis-cart:6379"
      - name: PORT
        value: "7070"
    resources:
      requests:
        cpu: 200m
        memory: 64Mi
      limits:
        cpu: 300m
        memory: 128Mi
    probes:
      startup:
        initialDelaySeconds: 10
        periodSeconds: 5
      liveness:
        initialDelaySeconds: 10
        periodSeconds: 10
      readiness:
        initialDelaySeconds: 10
        periodSeconds: 10

  # Special Case: Redis for cart storage
  redis:
    enabled: true
    image:
      registry: "docker.io"
      repository: library/redis
      tag: 6.2-alpine
    port: 6379
    resources:
      requests:
        cpu: 70m
        memory: 64Mi
      limits:
        cpu: 125m
        memory: 128Mi
    probes:
      liveness:
        initialDelaySeconds: 5
        periodSeconds: 5
      readiness:
        initialDelaySeconds: 5
        periodSeconds: 5

  currencyservice:
    enabled: true
    image:
      repository: currencyservice
      tag: ""
    port: 7000
    env:
      - name: PORT
        value: "7000"
      - name: DISABLE_PROFILER
        value: "1"
    resources:
      requests:
        cpu: 100m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi
    probes:
      startup:
        initialDelaySeconds: 30
        periodSeconds: 5
      liveness:
        initialDelaySeconds: 15
        periodSeconds: 10
      readiness:
        initialDelaySeconds: 15
        periodSeconds: 10

  shippingservice:
    enabled: true
    image:
      repository: shippingservice
      tag: "v0.9.0" # Downgrading to a slightly older version to test compatibility
    port: 50051
    env:
      - name: PORT
        value: "50051"
      - name: DISABLE_PROFILER
        value: "1"
      - name: GOMEMLIMIT
        value: "100MiB"
    resources:
      requests:
        cpu: 200m
        memory: 128Mi
      limits:
        cpu: 400m
        memory: 256Mi
    probes:
      startup:
        initialDelaySeconds: 30
        periodSeconds: 5
      liveness:
        initialDelaySeconds: 15
        periodSeconds: 10
      readiness:
        initialDelaySeconds: 15
        periodSeconds: 10

  adservice:
    enabled: true
    image:
      repository: adservice
      tag: ""
    port: 9555
    env:
      - name: PORT
        value: "9555"
    resources:
      requests:
        cpu: 200m
        memory: 180Mi
      limits:
        cpu: 300m
        memory: 300Mi
    probes:
      startup:
        initialDelaySeconds: 30
        periodSeconds: 5
        failureThreshold: 30
      liveness:
        initialDelaySeconds: 15
        periodSeconds: 10
      readiness:
        initialDelaySeconds: 15
        periodSeconds: 10

# Optional Load Generator (Disabled by default, enabled in dev)
loadgenerator:
  enabled: false
  image:
    repository: loadgenerator
    tag: ""
  replicas: 1
  resources:
    requests:
      cpu: 300m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi