global:
  imageRegistry: gcr.io/google-samples/microservices-demo
  defaultTag: v0.10.1

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: ScheduleAnyway

nameOverride: ""
fullnameOverride: ""

podSecurityContext:
  runAsNonRoot: false
  seccompProfile:
    type: RuntimeDefault

automountServiceAccountToken: false

securityContext:
  allowPrivilegeEscalation: false
  runAsNonRoot: false
  seccompProfile:
    type: RuntimeDefault
  readOnlyRootFilesystem: false

services:
  emailservice:
    enabled: true
    replicaCount: 1
    image:
      repository: emailservice
      tag: ""
    port: 8080
    emptyDirMounts:
      - /tmp
    env:
      - name: PORT
        value: "8080"
    probes:
      startupProbe:
        tcpSocket:
          port: 8080
        initialDelaySeconds: 10
        periodSeconds: 5
      livenessProbe:
        tcpSocket:
          port: 8080
        initialDelaySeconds: 10
        periodSeconds: 10
      readinessProbe:
        tcpSocket:
          port: 8080
        initialDelaySeconds: 10
        periodSeconds: 10

  checkoutservice:
    enabled: true
    replicaCount: 1
    image:
      repository: checkoutservice
      tag: ""
    port: 5050
    emptyDirMounts:
      - /tmp
    env:
      - name: PORT
        value: "5050"
      - name: SHIPPING_SERVICE_ADDR
        value: "shipping-service:50051"
      - name: PRODUCT_CATALOG_SERVICE_ADDR
        value: "productcatalog-service:3550"
      - name: CART_SERVICE_ADDR
        value: "cart-service:7070"
      - name: CURRENCY_SERVICE_ADDR
        value: "currency-service:7000"
      - name: PAYMENT_SERVICE_ADDR
        value: "payment-service:50051"
      - name: EMAIL_SERVICE_ADDR
        value: "email-service:8080"
    probes:
      startupProbe:
        tcpSocket:
          port: 5050
        initialDelaySeconds: 10
        periodSeconds: 5
      livenessProbe:
        tcpSocket:
          port: 5050
        initialDelaySeconds: 10
        periodSeconds: 10
      readinessProbe:
        tcpSocket:
          port: 5050
        initialDelaySeconds: 10
        periodSeconds: 10

  recommendationservice:
    enabled: true
    replicaCount: 1
    image:
      repository: recommendationservice
      tag: ""
    port: 8080
    emptyDirMounts:
      - /tmp
    env:
      - name: PORT
        value: "8080"
      - name: PRODUCT_CATALOG_SERVICE_ADDR
        value: "productcatalog-service:3550"
    probes:
      startupProbe:
        tcpSocket:
          port: 8080
        initialDelaySeconds: 10
        periodSeconds: 5
      livenessProbe:
        tcpSocket:
          port: 8080
        initialDelaySeconds: 10
        periodSeconds: 10
      readinessProbe:
        tcpSocket:
          port: 8080
        initialDelaySeconds: 10
        periodSeconds: 10

  frontend:
    enabled: true
    replicaCount: 1
    serviceType: ClusterIP
    image:
      repository: frontend
      tag: ""
    port: 8080
    emptyDirMounts:
      - /tmp
    env:
      - name: PORT
        value: "8080"
      - name: PRODUCT_CATALOG_SERVICE_ADDR
        value: "productcatalogservice:3550"
      - name: CURRENCY_SERVICE_ADDR
        value: "currencyservice:7000"
      - name: CART_SERVICE_ADDR
        value: "cartservice:7070"
      - name: SHIPPING_SERVICE_ADDR
        value: "shippingservice:50051"
      - name: RECOMMENDATION_SERVICE_ADDR
        value: "recommendationservice:8080"
      - name: CHECKOUT_SERVICE_ADDR
        value: "checkoutservice:5050"
      - name: AD_SERVICE_ADDR
        value: "adservice:9555"
      - name: SHOPPING_ASSISTANT_SERVICE_ADDR
        value: "shopping-assistant-service:8080"
    probes:
      startupProbe:
        httpGet:
          path: /
          port: 8080
        initialDelaySeconds: 60
        periodSeconds: 10
        failureThreshold: 30
      livenessProbe:
        httpGet:
          path: /
          port: 8080
        initialDelaySeconds: 15
        periodSeconds: 10
      readinessProbe:
        httpGet:
          path: /
          port: 8080
        initialDelaySeconds: 15
        periodSeconds: 10

  paymentservice:
    enabled: true
    replicaCount: 1
    image:
      repository: paymentservice
      tag: ""
    port: 50051
    emptyDirMounts:
      - /tmp
    env:
      - name: PORT
        value: "50051"
      - name: DISABLE_PROFILER
        value: "1"
    probes:
      startupProbe:
        tcpSocket:
          port: 50051
        initialDelaySeconds: 30
        periodSeconds: 5
      livenessProbe:
        tcpSocket:
          port: 50051
        initialDelaySeconds: 15
        periodSeconds: 10
      readinessProbe:
        tcpSocket:
          port: 50051
        initialDelaySeconds: 15
        periodSeconds: 10

  productcatalogservice:
    enabled: true
    replicaCount: 1
    image:
      repository: productcatalogservice
      tag: ""
    port: 3550
    emptyDirMounts:
      - /tmp
    env:
      - name: PORT
        value: "3550"
      - name: DISABLE_PROFILER
        value: "1"
    probes:
      startupProbe:
        tcpSocket:
          port: 3550
        initialDelaySeconds: 30
        periodSeconds: 5
      livenessProbe:
        tcpSocket:
          port: 3550
        initialDelaySeconds: 15
        periodSeconds: 10
      readinessProbe:
        tcpSocket:
          port: 3550
        initialDelaySeconds: 15
        periodSeconds: 10

  cartservice:
    enabled: true
    replicaCount: 1
    image:
      repository: cartservice
      tag: ""
    port: 7070
    emptyDirMounts:
      - /tmp
    env:
      - name: REDIS_ADDR
        value: "redis:6379"
      - name: PORT
        value: "7070"
    probes:
      startupProbe:
        tcpSocket:
          port: 7070
        initialDelaySeconds: 10
        periodSeconds: 5
      livenessProbe:
        tcpSocket:
          port: 7070
        initialDelaySeconds: 10
        periodSeconds: 10
      readinessProbe:
        tcpSocket:
          port: 7070
        initialDelaySeconds: 10
        periodSeconds: 10

  redis:
    enabled: true
    replicaCount: 1
    image:
      registry: "docker.io"
      repository: library/redis
      tag: 6.2-alpine
    port: 6379
    emptyDirMounts:
      - /data
    probes:
      livenessProbe:
        tcpSocket:
          port: 6379
        initialDelaySeconds: 5
        periodSeconds: 5
      readinessProbe:
        tcpSocket:
          port: 6379
        initialDelaySeconds: 5
        periodSeconds: 5

  currencyservice:
    enabled: true
    replicaCount: 1
    image:
      repository: currencyservice
      tag: ""
    port: 7000
    emptyDirMounts:
      - /tmp
    env:
      - name: PORT
        value: "7000"
      - name: DISABLE_PROFILER
        value: "1"
    probes:
      startupProbe:
        tcpSocket:
          port: 7000
        initialDelaySeconds: 30
        periodSeconds: 5
      livenessProbe:
        tcpSocket:
          port: 7000
        initialDelaySeconds: 15
        periodSeconds: 10
      readinessProbe:
        tcpSocket:
          port: 7000
        initialDelaySeconds: 15
        periodSeconds: 10

  shippingservice:
    enabled: true
    replicaCount: 1
    image:
      repository: shippingservice
      tag: "v0.9.0"
    port: 50051
    emptyDirMounts:
      - /tmp
    env:
      - name: PORT
        value: "50051"
      - name: DISABLE_PROFILER
        value: "1"
      - name: GOMEMLIMIT
        value: "104857600"
    probes:
      startupProbe:
        tcpSocket:
          port: 50051
        initialDelaySeconds: 30
        periodSeconds: 5
      livenessProbe:
        tcpSocket:
          port: 50051
        initialDelaySeconds: 15
        periodSeconds: 10
      readinessProbe:
        tcpSocket:
          port: 50051
        initialDelaySeconds: 15
        periodSeconds: 10

  adservice:
    enabled: true
    replicaCount: 1
    image:
      repository: adservice
      tag: ""
    port: 9555
    emptyDirMounts:
      - /tmp
    env:
      - name: PORT
        value: "9555"
    probes:
      startupProbe:
        tcpSocket:
          port: 9555
        initialDelaySeconds: 10
        periodSeconds: 5
        failureThreshold: 24
      readinessProbe:
        tcpSocket:
          port: 9555
        initialDelaySeconds: 10
        periodSeconds: 10
      livenessProbe:
        tcpSocket:
          port: 9555
        initialDelaySeconds: 10
        periodSeconds: 15

loadgenerator:
  enabled: false
  image:
    repository: loadgenerator
    tag: ""
  replicas: 1
  resources:
    requests:
      cpu: 300m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
